# Builds F1Tutor.exe on a real Windows machine and tests it. Started by hand from the Actions tab.
name: Windows exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build F1Tutor.exe
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --distpath dist-windows --workpath build/windows packaging/f1tutor.spec
      - name: Smoke test
        run: python packaging/smoke_test.py dist-windows/F1Tutor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: F1Tutor-windows
          path: dist-windows/F1Tutor.exe
